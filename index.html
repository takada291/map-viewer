<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>林小班図</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            width: 250px; /* 少しスリム化 */
            max-height: 85vh;
            overflow-y: auto;
            transition: all 0.3s;
        }

        #toggle-panel {
            float: right;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            background: none;
            border: none;
            padding: 0 5px;
            margin: 0;
        }

        h1 { font-size: 14px; margin: 0 0 10px 0; color: #333; display: inline-block; }

        /* レイヤーグループのシェイプアップ（折りたたみ式） */
        .layer-group { 
            margin-bottom: 8px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            padding: 5px; 
            background: #fff; 
        }
        summary.layer-title { 
            font-size: 12px; 
            font-weight: bold; 
            color: #007bff; 
            cursor: pointer; 
            outline: none; 
            list-style: none; 
            margin: 0; 
            padding: 2px 0; 
        }
        summary.layer-title::-webkit-details-marker { display: none; }
        summary.layer-title::before { content: "▶ "; font-size: 10px; color: #666; }
        details[open].layer-group > summary.layer-title::before { content: "▼ "; }
        .layer-content { margin-top: 5px; }

        input[type="file"] {
            font-size: 11px;
            width: 100%;
            margin-bottom: 5px;
        }
        
        label { font-size: 11px; display: block; margin-top: 2px; color: #555; }
        input[type="range"] { width: 100%; margin: 2px 0 5px 0; }
        
        /* 手動補正部分のシェイプアップ */
        details.manual-coord { margin-top: 5px; border: 1px solid #eee; border-radius: 4px; padding: 4px; background: #fdfdfd; }
        details.manual-coord summary { font-size: 11px; cursor: pointer; color: #555; outline: none; list-style: none; font-weight: bold; }
        details.manual-coord summary::-webkit-details-marker { display: none; }
        details.manual-coord summary::before { content: "▶ 手動補正"; font-size: 10px; }
        details.manual-coord[open] summary::before { content: "▼ 閉じる"; }

        .coord-row { display: flex; gap: 5px; margin-top: 3px; }
        input[type="number"] { flex: 1; font-size: 11px; padding: 3px; border: 1px solid #ccc; border-radius: 3px; }
        
        button.redraw-btn {
            width: 100%;
            font-size: 11px;
            padding: 4px;
            margin-top: 4px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button.redraw-btn:hover { background: #0056b3; }

        #gps-btn {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #gps-btn.active { color: white; background: #007bff; }

        #coord-display {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: none; 
            pointer-events: none; 
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="toggle-panel" onclick="toggleControls()">−</button>
        <h1>林小班図 v3.4</h1>
        
        <div id="panel-content">
            <details class="layer-group" open>
                <summary class="layer-title">レイヤー1 (奥/下)</summary>
                <div class="layer-content">
                    <input type="file" id="file1" accept="image/*" onchange="handleFileSelect(1)">
                    <label>透明度: <span id="opVal1">0.5</span></label>
                    <input type="range" id="range1" min="0" max="1" step="0.1" value="0.5" oninput="updateOpacity(1)">
                    
                    <details class="manual-coord">
                        <summary></summary>
                        <label>左下 (南西)</label>
                        <div class="coord-row">
                            <input type="number" id="swLat1" step="0.000001" placeholder="緯度"><input type="number" id="swLng1" step="0.000001" placeholder="経度">
                        </div>
                        <label>右上 (北東)</label>
                        <div class="coord-row">
                            <input type="number" id="neLat1" step="0.000001" placeholder="緯度"><input type="number" id="neLng1" step="0.000001" placeholder="経度">
                        </div>
                        <button class="redraw-btn" onclick="manualRedraw(1)">再描画</button>
                    </details>
                </div>
            </details>

            <details class="layer-group">
                <summary class="layer-title">レイヤー2 (手前/上)</summary>
                <div class="layer-content">
                    <input type="file" id="file2" accept="image/*" onchange="handleFileSelect(2)">
                    <label>透明度: <span id="opVal2">0.5</span></label>
                    <input type="range" id="range2" min="0" max="1" step="0.1" value="0.5" oninput="updateOpacity(2)">
                    
                    <details class="manual-coord">
                        <summary></summary>
                        <label>左下 (南西)</label>
                        <div class="coord-row">
                            <input type="number" id="swLat2" step="0.000001" placeholder="緯度"><input type="number" id="swLng2" step="0.000001" placeholder="経度">
                        </div>
                        <label>右上 (北東)</label>
                        <div class="coord-row">
                            <input type="number" id="neLat2" step="0.000001" placeholder="緯度"><input type="number" id="neLng2" step="0.000001" placeholder="経度">
                        </div>
                        <button class="redraw-btn" onclick="manualRedraw(2)">再描画</button>
                    </details>
                </div>
            </details>
        </div>
    </div>

    <div id="coord-display">緯度: -- / 経度: --</div>

    <div id="gps-btn" onclick="toggleGPS()">📍</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>
    
    <script>
        // --- 1. Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Failed', err));
        }

        // --- 2. Map & Base Layers Setup ---
        const gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "地理院タイル",
            maxZoom: 18
        });

        const gsiOrtho = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg', {
            attribution: "地理院タイル (オルソ)",
            maxZoom: 18
        });

        const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors",
            maxZoom: 19
        });

        const map = L.map('map', { 
            zoomControl: false,
            layers: [gsiStd] 
        }).setView([36.064, 136.220], 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const baseMaps = {
            "地理院地図 (標準)": gsiStd,
            "地理院地図 (オルソ)": gsiOrtho,
            "OpenStreetMap": osm
        };
        
        // ★変更点: コントロールの位置を左下(bottomleft)に移動してカブりを防止
        L.control.layers(baseMaps, null, { position: 'bottomleft' }).addTo(map);

        // --- 3. Dual Layer Logic ---
        const layers = {
            1: { overlay: null, opacity: 0.5 },
            2: { overlay: null, opacity: 0.5 }
        };

        function handleFileSelect(id) {
            const fileInput = document.getElementById('file' + id);
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                let coordsFromExif = null;
                let coordsFromFilename = null;

                try {
                    const exifObj = piexif.load(dataUrl);
                    const desc = exifObj["0th"][piexif.ImageIFD.ImageDescription];
                    if (desc) {
                        const coordsStr = typeof desc === 'string' ? desc : desc.toString();
                        const parts = coordsStr.split(',').map(parseFloat);
                        if (parts.length === 4 && !parts.some(isNaN)) {
                            coordsFromExif = parts; 
                        }
                    }
                } catch(err) {
                    console.log(`レイヤー${id}: Exifが存在しない、または読み取れませんでした。`);
                }

                if (!coordsFromExif) {
                    const nameParts = file.name.replace(/\.(jpg|jpeg|png)$/i, '').split(/[_,\s\-]+/);
                    const numParts = nameParts.filter(p => !isNaN(parseFloat(p)) && p.includes('.')).map(parseFloat);
                    if (numParts.length >= 4) {
                        coordsFromFilename = numParts;
                    }
                }

                const finalCoords = coordsFromExif || coordsFromFilename;
