<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>林小班図</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            width: 270px;
            max-height: 85vh;
            overflow-y: auto;
            transition: all 0.3s;
        }

        #toggle-panel {
            float: right;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            background: none;
            border: none;
            padding: 0 5px;
            margin: 0;
        }

        h1 { font-size: 14px; margin: 0 0 10px 0; color: #333; display: inline-block; }
        h3 { font-size: 12px; margin: 0 0 5px 0; color: #007bff; border-bottom: 1px solid #ddd; padding-bottom: 2px; }

        .layer-group { margin-bottom: 15px; }
        .layer-group:last-child { margin-bottom: 5px; }

        input[type="file"] {
            font-size: 11px;
            width: 100%;
            margin-bottom: 5px;
        }
        
        label { font-size: 11px; display: block; margin-top: 2px; color: #555; }
        input[type="range"] { width: 100%; margin: 2px 0 5px 0; }
        
        details { margin-top: 2px; border: 1px solid #eee; border-radius: 4px; padding: 2px; }
        summary { font-size: 11px; cursor: pointer; color: #555; outline: none; list-style: none; font-weight: bold; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: " ▶ 手動補正"; font-size: 10px; }
        details[open] summary::after { content: " ▼ 閉じる"; }

        .coord-row { display: flex; gap: 5px; margin-top: 3px; }
        input[type="number"] { flex: 1; font-size: 11px; padding: 3px; border: 1px solid #ccc; border-radius: 3px; }
        
        button.redraw-btn {
            width: 100%;
            font-size: 11px;
            padding: 4px;
            margin-top: 4px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button.redraw-btn:hover { background: #0056b3; }

        #gps-btn {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #gps-btn.active { color: white; background: #007bff; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="toggle-panel" onclick="toggleControls()">−</button>
        <h1>林小班図 v3.0</h1>
        
        <div id="panel-content">
            <div class="layer-group">
                <h3>レイヤー1 (奥/下)</h3>
                <input type="file" id="file1" accept="image/*" onchange="handleFileSelect(1)">
                <label>透明度: <span id="opVal1">0.5</span></label>
                <input type="range" id="range1" min="0" max="1" step="0.1" value="0.5" oninput="updateOpacity(1)">
                
                <details>
                    <summary></summary>
                    <label>左下 (南西)</label>
                    <div class="coord-row">
                        <input type="number" id="swLat1" step="0.000001"><input type="number" id="swLng1" step="0.000001">
                    </div>
                    <label>右上 (北東)</label>
                    <div class="coord-row">
                        <input type="number" id="neLat1" step="0.000001"><input type="number" id="neLng1" step="0.000001">
                    </div>
                    <button class="redraw-btn" onclick="manualRedraw(1)">再描画</button>
                </details>
            </div>

            <div class="layer-group">
                <h3>レイヤー2 (手前/上)</h3>
                <input type="file" id="file2" accept="image/*" onchange="handleFileSelect(2)">
                <label>透明度: <span id="opVal2">0.5</span></label>
                <input type="range" id="range2" min="0" max="1" step="0.1" value="0.5" oninput="updateOpacity(2)">
                
                <details>
                    <summary></summary>
                    <label>左下 (南西)</label>
                    <div class="coord-row">
                        <input type="number" id="swLat2" step="0.000001"><input type="number" id="swLng2" step="0.000001">
                    </div>
                    <label>右上 (北東)</label>
                    <div class="coord-row">
                        <input type="number" id="neLat2" step="0.000001"><input type="number" id="neLng2" step="0.000001">
                    </div>
                    <button class="redraw-btn" onclick="manualRedraw(2)">再描画</button>
                </details>
            </div>
        </div>
    </div>

    <div id="gps-btn" onclick="toggleGPS()">📍</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>
    
    <script>
        // --- 1. Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Failed', err));
        }

        // --- 2. Map Setup ---
        const map = L.map('map', { zoomControl: false }).setView([36.064, 136.220], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "地理院タイル",
            maxZoom: 18
        }).addTo(map);

        // --- 3. Dual Layer Logic ---
        const layers = {
            1: { overlay: null, opacity: 0.5 },
            2: { overlay: null, opacity: 0.5 }
        };

        function handleFileSelect(id) {
            const fileInput = document.getElementById('file' + id);
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                let coordsFromExif = null;
                let coordsFromFilename = null;

                // ① まず、魔法のExifポケット（ImageDescription）から座標を探す
                try {
                    const exifObj = piexif.load(dataUrl);
                    const desc = exifObj["0th"][piexif.ImageIFD.ImageDescription];
                    if (desc) {
                        const coordsStr = typeof desc === 'string' ? desc : desc.toString();
                        const parts = coordsStr.split(',').map(parseFloat);
                        if (parts.length === 4 && !parts.some(isNaN)) {
                            coordsFromExif = parts; // [south, west, north, east]
                            console.log(`レイヤー${id}: Exifから座標を読み込みました！`);
                        }
                    }
                } catch(err) {
                    console.log(`レイヤー${id}: Exifが存在しない、または読み取れませんでした。`);
                }

                // ② Exifになければ、従来のファイル名から座標を探す
                if (!coordsFromExif) {
                    const nameParts = file.name.replace(/\.(jpg|jpeg|png)$/i, '').split(/[_,\s\-]+/);
                    const numParts = nameParts.filter(p => !isNaN(parseFloat(p)) && p.includes('.')).map(parseFloat);
                    if (numParts.length >= 4) {
                        coordsFromFilename = numParts;
                        console.log(`レイヤー${id}: ファイル名から座標を読み込みました。`);
                    }
                }

                // Exif優先、なければファイル名を採用
                const finalCoords = coordsFromExif || coordsFromFilename;

                if (finalCoords) {
                    // 入力欄にセット
                    document.getElementById('swLat' + id).value = finalCoords[0];
                    document.getElementById('swLng' + id).value = finalCoords[1];
                    document.getElementById('neLat' + id).value = finalCoords[2];
                    document.getElementById('neLng' + id).value = finalCoords[3];
                    
                    // 描画実行
                    drawLayerFromDataUrl(id, dataUrl, finalCoords);
                } else {
                    alert("Exifデータおよびファイル名から座標を読み取れませんでした。\n手動で補正欄に入力してください。");
                }
            };
            reader.readAsDataURL(file);
        }

        function manualRedraw(id) {
            const fileInput = document.getElementById('file' + id);
            if (!fileInput.files[0]) {
                alert("画像ファイルが選択されていません");
                return;
            }
            const swLat = parseFloat(document.getElementById('swLat' + id).value);
            const swLng = parseFloat(document.getElementById('swLng' + id).value);
            const neLat = parseFloat(document.getElementById('neLat' + id).value);
            const neLng = parseFloat(document.getElementById('neLng' + id).value);

            if (isNaN(swLat) || isNaN(neLng)) return;
            const coords = [swLat, swLng, neLat, neLng];

            const reader = new FileReader();
            reader.onload = function(e) {
                drawLayerFromDataUrl(id, e.target.result, coords);
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function drawLayerFromDataUrl(id, dataUrl, coords) {
            // coords は [south, west, north, east] の順
            const bounds = [[coords[0], coords[1]], [coords[2], coords[3]]];
            const opacity = parseFloat(document.getElementById('range' + id).value);

            // 既存のレイヤーがあれば削除
            if (layers[id].overlay) {
                map.removeLayer(layers[id].overlay);
            }

            // 画像オーバーレイを追加
            layers[id].overlay = L.imageOverlay(dataUrl, bounds, {
                opacity: opacity,
                zIndex: id * 100 // レイヤー2を手前に表示
            }).addTo(map);

            map.fitBounds(bounds);
        }

        function updateOpacity(id) {
            const val = document.getElementById('range' + id).value;
            document.getElementById('opVal' + id).innerText = val;
            if (layers[id].overlay) {
                layers[id].overlay.setOpacity(val);
            }
        }

        // --- 4. GPS Logic ---
        let gpsMarker = null;
        let gpsWatchId = null;

        function toggleGPS() {
            const btn = document.getElementById('gps-btn');
            
            if (gpsWatchId) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
                btn.classList.remove('active');
                if (gpsMarker) map.removeLayer(gpsMarker);
                gpsMarker = null;
            } else {
                btn.classList.add('active');
                
                gpsWatchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        
                        if (!gpsMarker) {
                            alert("【受信成功】GPS信号をキャッチしました！\n現在地に赤い丸を表示します。");
                            gpsMarker = L.circleMarker([lat, lng], {
                                color: 'white',
                                weight: 4,
                                fillColor: 'red',
                                fillOpacity: 1,
                                radius: 12
                            }).addTo(map);
                        } else {
                            gpsMarker.setLatLng([lat, lng]);
                        }
                    },
                    (err) => {
                        alert("GPSエラー: " + err.message);
                        btn.classList.remove('active');
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        // --- 5. Panel Toggle ---
        function toggleControls() {
            const content = document.getElementById('panel-content');
            const btn = document.getElementById('toggle-panel');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                btn.innerText = '−';
            } else {
                content.style.display = 'none';
                btn.innerText = '＋';
            }
        }
    </script>
</body>
</html>
