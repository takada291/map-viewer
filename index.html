<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>林小班図</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // ここも測定IDに書き換えます
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            width: 270px;
            max-height: 85vh;
            overflow-y: auto;
            transition: all 0.3s;
        }

        #toggle-panel {
            float: right;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            background: none;
            border: none;
            padding: 0 5px;
            margin: 0;
        }

        h1 { font-size: 14px; margin: 0 0 10px 0; color: #333; display: inline-block; }
        h3 { font-size: 12px; margin: 0 0 5px 0; color: #007bff; border-bottom: 1px solid #ddd; padding-bottom: 2px; }

        .layer-group { margin-bottom: 15px; }
        .layer-group:last-child { margin-bottom: 5px; }

        input[type="file"] {
            font-size: 11px;
            width: 100%;
            margin-bottom: 5px;
        }
        
        label { font-size: 11px; display: block; margin-top: 2px; color: #555; }
        input[type="range"] { width: 100%; margin: 2px 0 5px 0; }
        
        details { margin-top: 2px; border: 1px solid #eee; border-radius: 4px; padding: 2px; }
        summary { font-size: 11px; cursor: pointer; color: #555; outline: none; list-style: none; font-weight: bold; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: " ▶ 手動補正"; font-size: 10px; }
        details[open] summary::after { content: " ▼ 閉じる"; }

        .coord-row { display: flex; gap: 5px; margin-top: 3px; }
        input[type="number"] { flex: 1; font-size: 11px; padding: 3px; border: 1px solid #ccc; border-radius: 3px; }
        
        button.redraw-btn {
            width: 100%;
            font-size: 11px;
            padding: 4px;
            margin-top: 4px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button.redraw-btn:hover { background: #0056b3; }

        /* GPSボタン */
        #gps-btn {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #gps-btn.active { color: white; background: #007bff; }

        /* カメラ（ワイプ）起動ボタン */
        #camera-btn {
            position: absolute;
            bottom: 85px; /* GPSボタンの上に配置 */
            right: 15px;
            z-index: 1000;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #camera-btn.active { color: white; background: #28a745; }

        /* 現在地座標表示 */
        #coord-display {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: none; 
            pointer-events: none; 
            white-space: nowrap;
        }

        /* ワイプカメラ映像の表示枠（左下） */
        #camera-preview {
            position: absolute;
            bottom: 25px;
            left: 10px;
            width: 100px;  
            height: 140px; 
            object-fit: cover; 
            border: 3px solid white; 
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 1000;
            display: none; 
            background-color: #000;
            pointer-events: none; 
        }

        /* Leafletの標準コントロール（ズーム＆レイヤー切替）をカメラボタンの上に押し上げる */
        .leaflet-bottom.leaflet-right {
            margin-bottom: 140px !important;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="toggle-panel" onclick="toggleControls()">−</button>
        <h1>林小班図 v3.8</h1>
        
        <div id="panel-content">
            <div class="layer-group">
                <h3>レイヤー1 (奥/下)</h3>
                <input type="file" id="file1" accept="image/*" onchange="handleFileSelect(1)">
                <label>透明度: <span id="opVal1">0.5</span></label>
                <input type="range" id="range1" min="0" max="1" step="0.1" value="0.5" oninput="updateOpacity(1)">
                
                <details>
                    <summary></summary>
                    <label>左下 (南西)</label>
                    <div class="coord-row">
                        <input type="number" id="swLat1" step="0.000001"><input type="number" id="swLng1" step="0.000001">
                    </div>
                    <label>右上 (北東)</label>
                    <div class="coord-row">
                        <input type="number" id="neLat1" step="0.000001"><input type="number" id="neLng1" step="0.000001">
                    </div>
                    <button class="redraw-btn" onclick="manualRedraw(1)">再描画</button>
                </details>
            </div>

            <div class="layer-group">
                <h3>レイヤー2 (手前/上)</h3>
                <input type="file" id="file2" accept="image/*" onchange="handleFileSelect(2)">
                <label>透明度: <span id="opVal2">0.5</span></label>
                <input type="range" id="range2" min="0" max="1" step="0.1" value="0.5" oninput="updateOpacity(2)">
                
                <details>
                    <summary></summary>
                    <label>左下 (南西)</label>
                    <div class="coord-row">
                        <input type="number" id="swLat2" step="0.000001"><input type="number" id="swLng2" step="0.000001">
                    </div>
                    <label>右上 (北東)</label>
                    <div class="coord-row">
                        <input type="number" id="neLat2" step="0.000001"><input type="number" id="neLng2" step="0.000001">
                    </div>
                    <button class="redraw-btn" onclick="manualRedraw(2)">再描画</button>
                </details>
            </div>
        </div>
    </div>

    <!-- カメラワイプ表示用ビデオ要素（iPhone等iOSでのインライン再生のため playsinline 属性が必須） -->
    <video id="camera-preview" autoplay playsinline muted></video>

    <div id="coord-display">緯度: -- / 経度: --</div>

    <div id="camera-btn" onclick="toggleCamera()">📷</div>
    <div id="gps-btn" onclick="toggleGPS()">📍</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>
    
    <script>
        // --- 1. Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Failed', err));
        }

        // --- 2. Map & Base Layers Setup ---
        const gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "地理院タイル",
            maxZoom: 18
        });

        const gsiOrtho = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg', {
            attribution: "地理院タイル (オルソ)",
            maxZoom: 18
        });

        const esriOrtho = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community",
            maxZoom: 18
        });

        const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>",
            maxZoom: 19
        });

        // マップ初期化
        const map = L.map('map', { 
            zoomControl: false,
            layers: [gsiStd] 
        }).setView([36.064, 136.220], 14);

        // ズームコントロールを右下に
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 背景図切替コントロール
        const baseMaps = {
            "地理院地図 (標準)": gsiStd,
            "地理院地図 (オルソ)": gsiOrtho,
            "衛星画像 (Esri)": esriOrtho,
            "OpenStreetMap": osm
        };
        L.control.layers(baseMaps, {}, { position: 'bottomright' }).addTo(map);


        // --- 3. Dual Layer Logic ---
        const layers = {
            1: { overlay: null, opacity: 0.5 },
            2: { overlay: null, opacity: 0.5 }
        };

        function handleFileSelect(id) {
            const fileInput = document.getElementById('file' + id);
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                let coordsFromExif = null;
                let coordsFromFilename = null;

                try {
                    const exifObj = piexif.load(dataUrl);
                    const desc = exifObj["0th"][piexif.ImageIFD.ImageDescription];
                    if (desc) {
                        const coordsStr = typeof desc === 'string' ? desc : desc.toString();
                        const parts = coordsStr.split(',').map(parseFloat);
                        if (parts.length === 4 && !parts.some(isNaN)) {
                            coordsFromExif = parts; 
                        }
                    }
                } catch(err) {
                    console.log(`レイヤー${id}: Exifが存在しない、または読み取れませんでした。`);
                }

                if (!coordsFromExif) {
                    const nameParts = file.name.replace(/\.(jpg|jpeg|png)$/i, '').split(/[_,\s\-]+/);
                    const numParts = nameParts.filter(p => !isNaN(parseFloat(p)) && p.includes('.')).map(parseFloat);
                    if (numParts.length >= 4) {
                        coordsFromFilename = numParts;
                    }
                }

                const finalCoords = coordsFromExif || coordsFromFilename;

                if (finalCoords) {
                    document.getElementById('swLat' + id).value = finalCoords[0];
                    document.getElementById('swLng' + id).value = finalCoords[1];
                    document.getElementById('neLat' + id).value = finalCoords[2];
                    document.getElementById('neLng' + id).value = finalCoords[3];
                    
                    drawLayerFromDataUrl(id, dataUrl, finalCoords);
                } else {
                    alert("Exifデータおよびファイル名から座標を読み取れませんでした。
手動で補正欄に入力してください。");
                }
            };
            reader.readAsDataURL(file);
        }

        function manualRedraw(id) {
            const fileInput = document.getElementById('file' + id);
            if (!fileInput.files[0]) {
                alert("画像ファイルが選択されていません");
                return;
            }
            const swLat = parseFloat(document.getElementById('swLat' + id).value);
            const swLng = parseFloat(document.getElementById('swLng' + id).value);
            const neLat = parseFloat(document.getElementById('neLat' + id).value);
            const neLng = parseFloat(document.getElementById('neLng' + id).value);

            if (isNaN(swLat) || isNaN(neLng)) return;
            const coords = [swLat, swLng, neLat, neLng];

            const reader = new FileReader();
            reader.onload = function(e) {
                drawLayerFromDataUrl(id, e.target.result, coords);
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function drawLayerFromDataUrl(id, dataUrl, coords) {
            const bounds = [[coords[0], coords[1]], [coords[2], coords[3]]];
            const opacity = parseFloat(document.getElementById('range' + id).value);

            if (layers[id].overlay) {
                map.removeLayer(layers[id].overlay);
            }

            layers[id].overlay = L.imageOverlay(dataUrl, bounds, {
                opacity: opacity,
                zIndex: id * 100 
            }).addTo(map);

            map.fitBounds(bounds);
        }

        function updateOpacity(id) {
            const val = document.getElementById('range' + id).value;
            document.getElementById('opVal' + id).innerText = val;
            if (layers[id].overlay) {
                layers[id].overlay.setOpacity(val);
            }
        }

        // --- 4. GPS Logic ---
        let gpsMarker = null;
        let gpsWatchId = null;

        function focusOnLocation(lat, lng) {
            map.setView([lat, lng], 16); 
        }

        function toggleGPS() {
            const btn = document.getElementById('gps-btn');
            const coordDisplay = document.getElementById('coord-display');
            
            if (gpsWatchId) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
                btn.classList.remove('active');
                if (gpsMarker) map.removeLayer(gpsMarker);
                gpsMarker = null;
                coordDisplay.style.display = 'none';
            } else {
                btn.classList.add('active');
                coordDisplay.style.display = 'block';
                coordDisplay.innerText = "GPS信号を検索中...";
                
                const gpsOptions = {
                    enableHighAccuracy: true,
                    maximumAge: 0,        
                    timeout: 10000        
                };

                gpsWatchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        
                        coordDisplay.innerText = `緯度: ${lat.toFixed(6)} / 経度: ${lng.toFixed(6)}`;

                        if (!gpsMarker) {
                            gpsMarker = L.circleMarker([lat, lng], {
                                color: 'white',
                                weight: 4,
                                fillColor: 'red',
                                fillOpacity: 1,
                                radius: 12
                            }).addTo(map);
                            focusOnLocation(lat, lng);
                        } else {
                            gpsMarker.setLatLng([lat, lng]);
                        }
                    },
                    (err) => {
                        if (err.code !== 3) {
                            alert("GPSエラー: " + err.message);
                            btn.classList.remove('active');
                            coordDisplay.style.display = 'none';
                        } else {
                            coordDisplay.innerText = "GPS信号を再取得中...";
                        }
                    },
                    gpsOptions 
                );
            }
        }

        function initLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        focusOnLocation(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => {
                        console.log("起動時の位置情報取得に失敗しました", err);
                    },
                    { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
                );
            }
        }
        
        window.addEventListener('load', initLocation);

        // --- 5. ワイプカメラ機能 ---
        let currentStream = null;

        function toggleCamera() {
            const video = document.getElementById('camera-preview');
            const btn = document.getElementById('camera-btn');

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                video.style.display = 'none';
                btn.classList.remove('active');
            } else {
                const constraints = {
                    video: { facingMode: "environment" },
                    audio: false
                };

                navigator.mediaDevices.getUserMedia(constraints)
                    .then(stream => {
                        currentStream = stream;
                        video.srcObject = stream;
                        video.style.display = 'block';
                        btn.classList.add('active');
                    })
                    .catch(err => {
                        alert("カメラの起動に失敗しました（権限が許可されていない可能性があります）\n" + err.message);
                    });
            }
        }

        // --- 6. Panel Toggle ---
        function toggleControls() {
            const content = document.getElementById('panel-content');
            const btn = document.getElementById('toggle-panel');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                btn.innerText = '−';
            } else {
                content.style.display = 'none';
                btn.innerText = '＋';
            }
        }
    </script>
</body>
</html>
